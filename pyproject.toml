[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sayari-poc"
version = "0.1.0"
description = "Sayari Forward Deployed Engineer Proof of Concept — sub-tier convergence screening, built on the official Sayari Python SDK"
readme = "README.md"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
requires-python = ">=3.11"

dependencies = [
    # The official Sayari client. Pinned EXACTLY: the SDK is beta and states that
    # breaking changes may land without a major version bump. Any bump re-runs the
    # conformance harness first (scripts/sdk_conformance.py).
    "sayari==0.1.43",
    # Direct dependency, not transitive: the audited transport is an httpx.BaseTransport
    # injected into the SDK client (src/sayari_poc/transport.py).
    "httpx",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pandas",
    "duckdb",
    "jinja2",
    "openpyxl",
    "pycountry==26.2.16",
    "typing-extensions",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "mypy>=1.17",
    "types-openpyxl",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sayari_poc*"]

[tool.setuptools.package-data]
sayari_poc = ["py.typed", "templates/*.j2", "sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    ".git",
    ".pytest_cache",
    ".pytest_tmp",
    ".mypy_cache",
    ".ruff_cache",
    "data/private",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = [
    "^\\.venv/",
    "^data/private/",
]

# DuckDB imports NumPy stubs for array APIs this project does not use.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# The Sayari SDK is Fern-generated and ships no py.typed guarantees this project
# can rely on under strict mode. Types are re-asserted at the adapter boundary
# (src/sayari_poc/sayari_sdk.py), which is where they are enforced anyway.
[[tool.mypy.overrides]]
module = ["sayari", "sayari.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# mypy --strict above is this project's type gate. This section only lines up VS Code's
# Pylance (Pyright) with it, so the editor doesn't flag code that mypy and the tests accept.
[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"

# In tests, Pyright can't see pydantic-settings' init-only `_env_file` argument, and it infers
# synthetic test data more narrowly than mypy does. Every such call runs in the suite, so a
# real mismatch still fails there.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportCallIssue = "none"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"

[[tool.pyright.executionEnvironments]]
root = "src"

[[tool.pyright.executionEnvironments]]
root = "scripts"
